<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>
    <link rel="stylesheet" href="music.css">
    <script src="https://kit.fontawesome.com/b2526fc861.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div class="music-player">
      <nav>
        <div class="circle">
          <i class="fa-solid fa-angle-left"></i>
        </div>
         <div class="circle">
          <i class="fa-solid fa-bars"></i>
        </div>
      </nav>
      <img src="div-in.jpg" class="song-img">
      <h2>Divine Intervention</h2>
      <p>Eminem - Heaven</p>

      <audio id="song">
        <source src="EMINEM-feat-NF-HEAVEN-HEAVEN-(CeeNaija.com).mp3" type="audio/mpeg">
      </audio>
      <input type="range" value="0" id="progress">

      <div class="controls">
       <div><i class="fa-solid fa-backward-step"></i></div>
        <div onclick="playPause()"><i class="fa-solid fa-play" id="ctrlIcon"></i></div>
        <div><i class="fa-solid fa-forward-step"></i></div>
      </div>
    </div>
  </div>

<script>
  let progress = document.getElementById("progress");
  let song = document.getElementById("song");
  let ctrlIcon = document.getElementById("ctrlIcon");

  song.onloadedmetadata = function() {
    progress.max = song.duration;
    progress.value = song.currentTime;
  }

function playPause() {
  if (ctrlIcon.classList.contains("fa-play")) {
    song.play();
    ctrlIcon.classList.remove("fa-play");
    ctrlIcon.classList.add("fa-pause");
  } else {
    song.pause();
    ctrlIcon.classList.remove("fa-pause");
    ctrlIcon.classList.add("fa-play");
  } 
}

if (song.play()) {
  setInterval(() => {
    progress.value = song.currentTime;
  }, 500);
}

progress.onchange = function() {
  song.currentTime = progress.value;
  song.play();
  ctrlIcon.classList.remove("fa-play");
  ctrlIcon.classList.add("fa-pause");
}





</script>



</body>
</html>
