<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>

    <!-- ✅ Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">


    <link rel="stylesheet" href="music.css">
    <script src="https://kit.fontawesome.com/b2526fc861.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div class="music-player">
      <nav>
        <div class="circle">
          <i class="fa-solid fa-angle-left"></i>
        </div>
        <div class="circle">
          <i class="fa-solid fa-bars"></i>
        </div>
      </nav>

      <img src="div-in.jpg" class="song-img">
      <h2>Divine Intervention</h2>
      <p>Eminem - Heaven</p>

      <audio id="song" preload="metadata">
        <source src="EMINEM-feat-NF-HEAVEN-HEAVEN-(CeeNaija.com).mp3" type="audio/mpeg">
      </audio>

      <input type="range" id="progress" value="0" min="0" step="1">

      <div class="controls">
        <div><i class="fa-solid fa-backward-step"></i></div>
        <div onclick="playPause()">
          <i class="fa-solid fa-play" id="ctrlIcon"></i>
        </div>
        <div><i class="fa-solid fa-forward-step"></i></div>
      </div>
    </div>
  </div>

<script>
  let progress = document.getElementById("progress");
  let song = document.getElementById("song");
  let ctrlIcon = document.getElementById("ctrlIcon");

  song.onloadedmetadata = function () {
    progress.max = song.duration;
    progress.value = song.currentTime;
  };

  function playPause() {
    if (song.paused) {
      song.play();
      ctrlIcon.classList.replace("fa-play", "fa-pause");
    } else {
      song.pause();
      ctrlIcon.classList.replace("fa-pause", "fa-play");
    }
  }

  setInterval(() => {
    if (!song.paused) {
      progress.value = song.currentTime;
    }
  }, 500);

  progress.oninput = function () {
    song.currentTime = progress.value;
  };
</script>

</body>
</html>
