<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="music-player.css">
</head>
<body>
  <main class="player">
    <div class="art"></div>
    <div class="meta">
      <h2 id="title">Title</h2>
      <p id="artist">Artist</p>
    </div>

    <div class="controls">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="play" aria-label="Play">▶️</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>

    <div class="progress">
      <span id="current">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0">
      <span id="duration">0:00</span>
    </div>

    <div class="extras">
      <label class="volume">🔊
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </label>
      <button id="shuffle" title="Shuffle">🔀</button>
      <button id="repeat" title="Repeat">🔁</button>
    </div>

    <ul id="playlist" class="playlist"></ul>

    <audio id="audio"></audio>
  </main>

  <script src="music-player.js" type="module"></script>
</body>
</html>
