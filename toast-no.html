<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toast Notification</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="toast.css">
</head>
<body>

  <div class="buttons">
    <button onclick="showToast(successMessage, 'success')">Success</button>
    <button onclick="showToast(errorMessage, 'error')">Error</button>
    <button onclick="showToast(invalidMessage, 'invalid')">Invalid</button>
  </div>

  <div id="toastBox"></div>

  <script src="toast.js"></script>
</body>
</html>
