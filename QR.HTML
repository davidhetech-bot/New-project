<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="QR.CSS">
</head>
<body>
  <div class="container">
    <p>Enter your text or URL:</p>
    <input type="text" placeholder="Type or URL here" id="qrTest">

    <div id="imgBox">
      <!-- QR Code will be displayed here -->
      <img src="" id="qrImage">
    </div>

    <button onclick="generateQR()">Generate QR Code</button>

  </div>
  <script>
    // Selecting required elements
  let imgBox = document.getElementById('imgBox');
  let qrImage = document.getElementById('qrImage');
  let qrTest = document.getElementById('qrTest');

    // Function to generate QR code
  function generateQR() {
    if (qrTest.value.length > 0) {
      qrImage.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" +
        encodeURIComponent(qrTest.value);

      imgBox.classList.add("show-img");
      qrTest.classList.remove("error");
    } else {
      qrTest.classList.add("error");
      setTimeout(() => {
        qrTest.classList.remove("error");
      }, 1000);
    }
  }
</script>

</body>
</html>
