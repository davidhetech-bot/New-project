<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch Using JavaScript</title>
  <link rel="stylesheet" href="stop-watch.css">
</head>
<body>
  <div class="stopwatch">
    <h1 id="displayTime">00:00:00</h1>
    <div class="button">
      <img src="icons8-stop-48.png" alt="stop" onclick="watchStop()">
      <img src="start.png" alt="Start" onclick="watchStart()">
      <img src="reset.png" alt="reset" onclick="watchReset()">
    </div>

  </div>
  <script src="stop-watch.js"></script>
</body>
</html>
