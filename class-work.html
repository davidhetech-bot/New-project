<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App - Easy Tutorials</title>
  <link rel="stylesheet" href="stylee.css" />
</head>

<body>

  <div class="card">

    <div class="search">
      <input type="text" placeholder="Enter city name" spellcheck="false">
      <button><img src="dav.png.png" alt="search app"></button>
    </div>
      <div class="error">
        <p>Invalid city name</p>
      </div>
    <div class="weather">
      <img src="weather.png" class="weather-icon">
      <h1 class="temp">22°C</h1>
      <h2 class="city">NEW YORK</h2>
    

    <div class="weather-info">

      <div class="info-box">
        <img src="humidity (2).png" alt="Humidity icon" class="icon" />
        <div>
          <p class="value">50%</p>
          <p class="label">Humidity</p>
        </div>
      </div>

      <div class="info-box">
        <img src="windy.png" alt="Wind icon" class="icon"/>
        <div>
          <p class="wind">15 km/h</p>
          <p class="label">Wind Speed</p>
        </div>
      </div>

    </div>

  </div>

<script>
const apiKey = "cfe43e0884a529fd01005aab590e9757";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon = document.querySelector(".weather-icon");
const errorBox = document.querySelector(".error");
const weatherBox = document.querySelector(".weather");

async function checkWeather(city) {
  if (!city) {
    alert("Please enter a city name");
    return;
  }

  const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

  if (response.status === 404) {
    errorBox.style.display = "block";
    weatherBox.style.display = "none";
    return;
  }

  const data = await response.json();

  errorBox.style.display = "none";
  weatherBox.style.display = "block";

  document.querySelector(".city").innerHTML = data.name;
  document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
  document.querySelector(".value").innerHTML = data.main.humidity + "%";
  document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

  const condition = data.weather[0].main;

  if (condition === "Clouds") weatherIcon.src = "cloud.png";
  else if (condition === "Clear") weatherIcon.src = "sun.png";
  else if (condition === "Rain") weatherIcon.src = "rain.png";
  else if (condition === "Drizzle") weatherIcon.src = "rainy-day.png";
  else if (condition === "Mist") weatherIcon.src = "mist.png";
  else weatherIcon.src = "default.png";
}

searchBtn.addEventListener("click", () => {
  checkWeather(searchBox.value.trim());
});
</script>

</body>
</html>
